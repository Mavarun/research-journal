[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-journal"
version = "0.1.0"
description = "Structured experiment log for a research portfolio"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "M.Varun", email = "116015799+Mavarun@users.noreply.github.com" }]
dependencies = [
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
rj-new = "research_journal.cli:main_new"
rj-render = "research_journal.cli:main_render"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
